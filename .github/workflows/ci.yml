name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: tysvora }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TYSVORA_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/tysvora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          psql "$TYSVORA_TEST_DATABASE_URL" -c "create role anon nologin" -c "create role authenticated nologin"
          db/apply-local.sh "$TYSVORA_TEST_DATABASE_URL"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
